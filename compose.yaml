services:
  db:
    image: docker.io/library/postgres:latest
    container_name: nonobot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nonobot
      POSTGRES_PASSWORD: develop
      POSTGRES_DB: nonodata
    ports:
      - "5432:5432"
    volumes: 
      - db-data:/var/lib/postgresql

  bot:
    build: .
    container_name: nonobot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
    # environment:
    volumes:
      - ./config.toml:/config.toml:ro,Z

volumes:
  db-data: